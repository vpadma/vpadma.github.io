name: BIO426 source artwork retrieval
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch attributed source artwork
        run: |
          mkdir -p plates
          curl --fail --retry 2 -L 'https://upload.wikimedia.org/wikipedia/commons/f/f6/Left_marginal_vein_of_heart.png' -o plates/Left_marginal_vein_of_heart.png
          curl --fail --retry 2 -L 'https://upload.wikimedia.org/wikipedia/commons/c/c3/Pectinate_muscles_of_right_atrium.png' -o plates/Pectinate_muscles_of_right_atrium.png
          curl --fail --retry 2 -L 'https://upload.wikimedia.org/wikipedia/commons/4/4d/Gray577.png' -o plates/Gray577.png
          curl --fail --retry 2 -L 'https://upload.wikimedia.org/wikipedia/commons/3/33/Gray591.png' -o plates/Gray591.png
      - uses: actions/upload-artifact@v4
        with:
          name: anatomy-source-artwork
          path: plates/
          retention-days: 7
